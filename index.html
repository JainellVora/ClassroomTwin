<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect — SAKEC School Collaboration Platform</title>
  <meta name="description" content="CampusConnect brings classes, assignments, resources, chat, and video meetings together for SAKEC students and teachers.">
  <meta name="theme-color" content="#8b5cf6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Atmospheric background -->
  <div id="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- App mount -->
  <div id="app" role="main"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true"></div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js"></script>
</body>
</html>
